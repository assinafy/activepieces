name: Publish Assinafy piece

on:
  push:
    tags:
      - 'piece-assinafy-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-assinafy-piece
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'assinafy/activepieces'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the piece version
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "piece-assinafy-v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the piece version $VERSION."
            exit 1
          fi

      - name: Typecheck and test the piece
        run: |
          npm run typecheck
          npm test

      - name: Build the piece
        run: npm run build

      - name: Publish to npm with trusted publishing
        working-directory: dist
        run: npm publish --access public
